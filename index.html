<style>
/* Layout: phone-first single column — home with two bar tiles, password gate, then bar payroll view */
:root{
  --bg:#f6f3ef; --surface:#ffffff; --fg:#231c16; --muted:#7a6d62; --line:#e6ded5;
  --accent:#9a4a16; --accent-soft:#f6e6d9; --epo:#2f5d62; --epo-soft:#dcebec; --bad:#b3362b;
  --tile:#e8873a;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#211b16; --fg:#f1e9e1; --muted:#a89889; --line:#3a2f27;
  --accent:#e08a4c; --accent-soft:#3a2618; --epo:#7cc1c6; --epo-soft:#1d3335; --bad:#ef7b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#211b16; --fg:#f1e9e1; --muted:#a89889; --line:#3a2f27;
  --accent:#e08a4c; --accent-soft:#3a2618; --epo:#7cc1c6; --epo-soft:#1d3335; --bad:#ef7b6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:22px;font-weight:700;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:14px;font-weight:500;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.num{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.tiles{grid-template-columns:1fr}}
.tile{border:0;border-radius:18px;padding:26px 18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:30px;min-height:150px;font:inherit}
.tile .t{font-family:var(--display);font-size:26px;font-weight:700}
.tile .s{font-size:13px;opacity:.8}
.tile.b13,.tile.bepo{background:var(--tile);color:#1a120b}
.tile .s{opacity:.75}
.tile:focus-visible,button:focus-visible,input:focus{outline:2px solid var(--fg);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
select,input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--accent);color:#fff}
.btn.epo{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px;font-weight:500}
.err{color:var(--bad);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:7px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c,var(--accent));color:#fff}
.people{display:flex;flex-direction:column;gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph .name{font-weight:600;font-size:16px}
.ph .total{font-family:var(--display);font-size:20px;font-weight:700}
.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:12px;color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:2px}
.ln{display:grid;grid-template-columns:1fr auto minmax(84px,auto);gap:10px;align-items:baseline;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.ln .v{color:var(--muted);font-size:13px}
.ln b{text-align:right;color:var(--accent)}
.zp{display:block;color:var(--accent);font-weight:600}
.parts span b{display:block;color:var(--fg);font-weight:600;font-size:13px}
@media (max-width:460px){.parts{grid-template-columns:repeat(3,1fr)}}
.total-line{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px;font-weight:600}
.total-line b{font-family:var(--display);font-size:18px}
.log{overflow-x:auto;padding:8px 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
.note{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px;font-size:14px}
.mnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mnav b{font-family:var(--display);font-size:16px;font-weight:500;text-transform:capitalize}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
.c0{background:var(--accent-soft);color:var(--accent)}.c1{background:var(--epo-soft);color:var(--epo)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.dot.c0{background:var(--accent)}.dot.c1{background:var(--epo)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:62px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.we .dn{color:var(--accent)}
.day.today{border:2px solid var(--fg)}
.dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.who{font-size:10px;font-weight:600;border-radius:5px;padding:2px 2px;line-height:1.15;overflow:hidden;white-space:nowrap;letter-spacing:-.02em}
.who i{display:block;font-style:normal;font-weight:400;font-size:10px;opacity:.85}
.ln b{white-space:nowrap}
.who.plan{background:transparent;border:1px dashed currentColor}
.day.ed{cursor:pointer}
.day.ed:active{transform:scale(.97)}
.who.plan{background:transparent;border:1px dashed currentColor}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal .sheet{width:100%;max-width:520px}
.picks{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:12px;font:inherit;font-size:17px;font-weight:600;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-align:left}
.pick .box{width:22px;height:22px;border-radius:6px;border:2px solid currentColor;flex:none}
.pick.on.c0{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pick.on.c1{background:var(--epo-soft);color:var(--epo);border-color:var(--epo)}
.pick.on .box{background:currentColor}
.pick:disabled{opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px}
</style>

</head><body>
<div class="wrap">
  <section id="home">
    <div style="display:flex;flex-direction:column;gap:20px">
      <header><h1>Моя ЗПшечка</h1><div class="sub">Выберите бар</div></header>
      <div class="tiles">
        <button class="tile b13" data-bar="13"><span class="t">13шка</span><span class="s">Московская 33</span></button>
        <button class="tile bepo" data-bar="epo"><span class="t">ЕпО</span><span class="s">Ещё по одной</span></button>
      </div>
      <div class="note" id="updNote"></div>
    </div>
  </section>

  <section id="gate" hidden>
    <form class="panel" id="gateForm" autocomplete="off">
      <div class="top"><h2 id="gateTitle">13шка</h2><button type="button" class="btn small ghost" id="gateBack">Назад</button></div>
      <label>Пароль<input id="pw" type="password" autocomplete="current-password" required></label>
      <div class="err" id="gateErr" hidden>Неверный пароль для этого бара</div>
      <button class="btn" id="gateBtn" type="submit">Войти</button>
    </form>
  </section>

  <section id="barhome" hidden>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="top">
        <div><h1 id="bTitle">13шка</h1><div class="sub" id="bSub"></div></div>
        <div class="row" style="gap:6px">
          <button class="btn small" id="switchBar" style="background:var(--tile);color:#1a120b" hidden>Другой бар</button>
          <button class="btn small ghost" id="logout">Выйти</button>
        </div>
      </div>
      <div class="tiles">
        <button class="tile b13" id="goPay"><span class="t">Зарплата</span><span class="s" id="payHint"></span></button>
        <button class="tile b13" id="goSched"><span class="t">График</span><span class="s" id="schedHint"></span></button>
      </div>
    </div>
  </section>

  <section id="sched" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="top">
        <div><h1>График</h1><div class="sub" id="sSub"></div></div>
        <button class="btn small ghost back">Назад</button>
      </div>
      <div class="mnav">
        <button class="btn small ghost" id="mPrev" aria-label="Предыдущий месяц">‹</button>
        <b id="mLabel"></b>
        <button class="btn small ghost" id="mNext" aria-label="Следующий месяц">›</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="cal" id="cal"></div>
      <div class="people" id="schedSum"></div>
      <div class="note" id="schedNote"></div>
    </div>
  </section>

  <section id="view" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="top">
        <div><h1 id="vTitle">Зарплата</h1><div class="sub" id="vSub"></div></div>
        <button class="btn small ghost back">Назад</button>
      </div>
      <div class="row">
        <label style="flex:1;min-width:130px">Месяц<input type="month" id="month"></label>
        <div class="seg" role="group" aria-label="Выплата" id="half">
          <button data-h="1">1–15</button><button data-h="2">16–31</button><button data-h="0">Месяц</button>
        </div>
      </div>
      <label>Бармен<select id="who"></select></label>
      <section style="display:flex;flex-direction:column;gap:10px">
        <div class="ph"><h2>К выплате <span id="pLabel" class="num" style="color:var(--muted)"></span></h2>
          <button class="btn small ghost" id="copy">Скопировать</button></div>
        <div class="people" id="people"></div>
        <div class="total-line" id="grand"></div>
      </section>
      <section style="display:flex;flex-direction:column;gap:10px">
        <h2>Смены</h2>
        <div class="panel log"><table>
          <thead><tr><th>Дата</th><th>Бармен</th><th>Розлив</th><th>Фас.+вода</th><th>Наст.</th><th>Кухня+снеки</th><th>ЗП</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </section>
    </div>
  </section>
</div>

<div class="modal" id="dayModal" hidden>
  <div class="sheet panel">
    <div class="top"><h2 id="dmTitle"></h2><button class="btn small ghost" id="dmClose">Готово</button></div>
    <div class="note" id="dmFact"></div>
    <div class="picks" id="dmPicks"></div>
    <div class="err" id="dmErr" hidden></div>
  </div>
</div>

const BAR={'13':{t:'13шка',s:'Московская 33',c:'var(--accent)'},'epo':{t:'ЕпО',s:'Ещё по одной',c:'var(--accent)'}};
const $=id=>document.getElementById(id);
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const te=new TextEncoder(),td=new TextDecoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const unlocked={};let cur=null,canAll=false;
const LS='zp-auth-v1';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let half=new Date().getDate()<=15?'1':'2';

function show(id){['home','gate','barhome','view','sched'].forEach(x=>$(x).hidden=x!==id);window.scrollTo(0,0);}
async function pwKey(pw,salt){const base=await crypto.subtle.importKey('raw',te.encode(pw.normalize('NFC').trim().toLowerCase().replace(/ё/g,'е')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:VAULT.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function tryUnlock(bar,pw){
  for(const w of VAULT.bars[bar].wraps){try{
    const k=await pwKey(pw,w.salt);
    const pk=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.iv)},k,b64(w.ct));
    const priv=await crypto.subtle.importKey('pkcs8',pk,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
    const d=VAULT.bars[bar].data;
    const epub=await crypto.subtle.importKey('raw',b64(d.epub),{name:'ECDH',namedCurve:'P-256'},false,[]);
    const ak=await crypto.subtle.deriveKey({name:'ECDH',public:epub},priv,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.iv)},ak,b64(d.ct));
    const out=JSON.parse(td.decode(pt));
    const c=VAULT.bars[bar].cfg;
    if(c){try{const ep=await crypto.subtle.importKey('raw',b64(c.epub),{name:'ECDH',namedCurve:'P-256'},false,[]);
      const ck=await crypto.subtle.deriveKey({name:'ECDH',public:ep},priv,{name:'AES-GCM',length:256},false,['decrypt']);
      out.cfg=JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(c.iv)},ck,b64(c.ct))));}catch(e){}}
    return out;
  }catch(e){}}
  return null;}

let gateBar=null;
document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
  const b=t.dataset.bar;if(unlocked[b]){open(b);return;}
  gateBar=b;$('gateTitle').textContent=BAR[b].t;$('gateBtn').className='btn'+(b==='epo'?' epo':'');
  $('gateErr').hidden=true;$('pw').value='';show('gate');setTimeout(()=>$('pw').focus(),50);});
$('gateBack').onclick=()=>show('home');
$('gateForm').onsubmit=async e=>{e.preventDefault();const pw=$('pw').value;$('gateBtn').disabled=true;$('gateBtn').textContent='Проверяю…';
  const data=await tryUnlock(gateBar,pw);
  if(data){unlocked[gateBar]=data;const other=gateBar==='13'?'epo':'13';
    const od=await tryUnlock(other,pw);if(od){unlocked[other]=od;canAll=true;}
    const saved=lsGet(LS)||{};saved[gateBar]=pw;if(canAll)saved[other]=pw;lsSet(LS,saved);
    $('pw').value='';open(gateBar);}
  else $('gateErr').hidden=false;
  $('gateBtn').disabled=false;$('gateBtn').textContent='Войти';};
$('logout').onclick=()=>{for(const k in unlocked)delete unlocked[k];canAll=false;cur=null;lsSet(LS,null);lsSet('zp-who',null);show('home');};
$('switchBar').onclick=()=>open(cur==='13'?'epo':'13');

function open(bar){cur=bar;lsSet('zp-bar',bar);const d=unlocked[bar];
  $('bTitle').textContent=BAR[bar].t;$('bTitle').style.color=BAR[bar].c;
  $('bSub').textContent='Данные GainUp на '+d.updated;
  $('vSub').textContent=BAR[bar].t+' · данные на '+d.updated;
  $('sSub').textContent=BAR[bar].t+' · данные на '+d.updated;
  $('half').style.setProperty('--c',BAR[bar].c);
  $('switchBar').hidden=!(canAll&&unlocked[bar==='13'?'epo':'13']);
  if(!$('month').value){const months=[...new Set(d.shifts.map(s=>s.date.slice(0,7)))].sort();$('month').value=months[months.length-1]||new Date().toISOString().slice(0,7);}
  const names=[...new Set(d.shifts.map(s=>s.name))].sort((a,b)=>a.localeCompare(b,'ru'));
  if(who[cur]&&!names.includes(who[cur]))who[cur]='';
  $('who').innerHTML='<option value="">Все бармены</option>'+names.map(n=>`<option${who[cur]===n?' selected':''}>${esc(n)}</option>`).join('');
  render();
  const tot=visible().reduce((a,s)=>a+pay(s).total,0);
  $('payHint').textContent=(who[cur]?who[cur]+' · ':'')+periodLabel()+' · '+rub(tot);
  const ls=(d.sched||[]).filter(s=>s.sales>0||(!s.close&&s.date===todayStr())).sort((a,b)=>b.date.localeCompare(a.date))[0];
  $('schedHint').textContent=ls?'Последняя смена: '+ls.date.slice(8)+'.'+ls.date.slice(5,7)+' · '+ls.name:'';
  show('barhome');}

document.querySelectorAll('.back').forEach(b=>b.onclick=()=>open(cur));
$('goPay').onclick=()=>{show('view');render();};
$('goSched').onclick=()=>{sm=todayStr().slice(0,7);show('sched');renderSched();loadPlan();};
let sm=new Date().toISOString().slice(0,7);
function shiftMonth(k){const[y,m]=sm.split('-').map(Number);const d=new Date(y,m-1+k,1);sm=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderSched();}
$('mPrev').onclick=()=>shiftMonth(-1);$('mNext').onclick=()=>shiftMonth(1);
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function hrs(s){if(!s.close)return null;const a=new Date(s.date+'T'+s.open),b=new Date(s.close);return (b-a)/36e5;}
function fmtH(h){const H=Math.floor(h),M=Math.round((h-H)*60);return H+' ч'+(M?' '+M+' мин':'');}
const planCache={};
async function loadPlan(){const d=unlocked[cur];if(!d.cfg)return;
  try{const r=await fetch(d.cfg.url+'?bar='+cur+'&key='+encodeURIComponent(d.cfg.key)).then(r=>r.json());
    if(r.ok){planCache[cur]=r.plan;lsSet('zp-plan-'+cur,r.plan);renderSched();}}catch(e){}}
async function setPlan(date,name,on){const d=unlocked[cur];
  const r=await fetch(d.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:d.cfg.key,bar:cur,date,name,on})}).then(r=>r.json());
  if(!r.ok)throw new Error(r.error);planCache[cur]=r.plan;lsSet('zp-plan-'+cur,r.plan);}
const todayStr=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
let dmDate=null;
function openDay(ds){const d=unlocked[cur];if(!d.cfg||ds<todayStr())return;dmDate=ds;
  const names=barNames();const plan=(planCache[cur]||[]).filter(s=>s.date===ds).map(s=>s.name);
  const [y,m,dd]=ds.split('-');const wd=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'][new Date(+y,m-1,+dd).getDay()];
  $('dmTitle').textContent=+dd+' '+MONG[m-1]+', '+wd;
  const f=(d.sched||[]).filter(s=>s.date===ds&&(s.sales>0||(!s.close&&s.date===todayStr())));$('dmFact').textContent=f.length?'По факту на смене: '+f.map(s=>s.name).join(', '):'Отметьте, кто выходит в этот день';
  $('dmPicks').innerHTML=names.map(n=>`<button class="pick ${plan.includes(n)?'on':''} ${colOf(n,names)}" data-n="${esc(n)}"><span class="box"></span>${esc(n)}</button>`).join('');
  $('dmErr').hidden=true;$('dayModal').hidden=false;}
$('dmClose').onclick=()=>{$('dayModal').hidden=true;renderSched();};
$('dayModal').onclick=e=>{if(e.target.id==='dayModal'){$('dayModal').hidden=true;renderSched();}};
$('dmPicks').onclick=async e=>{const b=e.target.closest('.pick');if(!b||b.disabled)return;const on=!b.classList.contains('on');
  b.disabled=true;b.classList.toggle('on',on);
  try{await setPlan(dmDate,b.dataset.n,on);}catch(err){b.classList.toggle('on',!on);$('dmErr').textContent='Не сохранилось. Проверьте интернет и попробуйте ещё раз.';$('dmErr').hidden=false;}
  b.disabled=false;};
const MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function barNames(){const d=unlocked[cur];return [...new Set([...(d.sched||[]),...(planCache[cur]||[])].map(s=>s.name))].sort((a,b)=>a.localeCompare(b,'ru'));}
function colOf(n,names){return 'c'+(names.indexOf(n)%2);}
$('cal').onclick=e=>{const c=e.target.closest('.day[data-d]');if(c)openDay(c.dataset.d);};
function renderSched(){const d=unlocked[cur];const list=(d.sched||[]).filter(s=>s.date.startsWith(sm)&&(s.sales>0||(!s.close&&s.date===todayStr())));
  if(!planCache[cur])planCache[cur]=lsGet('zp-plan-'+cur)||[];
  const plan=planCache[cur].filter(s=>s.date.startsWith(sm));
  const names=barNames();
  $('schedNote').textContent=d.cfg?'Прошедшие дни — по факту из GainUp, под именем ЗП за смену. Нажмите на сегодняшний или будущий день, чтобы отметить, кто выходит.':'Прошедшие дни — по факту из GainUp, под именем ЗП за смену. Отмечать смены вперёд можно будет после подключения хранилища.';
  const col=n=>'c'+(names.indexOf(n)%2);
  const[y,m]=sm.split('-').map(Number);$('mLabel').textContent=MON[m-1]+' '+y;
  $('legend').innerHTML=names.map(n=>`<span class="chip ${col(n)}">${esc(n)}</span>`).join('');
  const first=(new Date(y,m-1,1).getDay()+6)%7, L=new Date(y,m,0).getDate(), today=todayStr();
  let cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>`<div class="wd">${w}</div>`).join('')+'<div></div>'.repeat(first);
  for(let i=1;i<=L;i++){const ds=sm+'-'+String(i).padStart(2,'0');const f=list.filter(s=>s.date===ds);const p=plan.filter(s=>s.date===ds&&!f.length);const ed=d.cfg&&ds>=today;
    const we=((first+i-1)%7)>=5;
    cells+=`<div class="day${ds===today?' today':''}${we?' we':''}${ed?' ed':''}"${ed?` data-d="${ds}" role="button" tabindex="0"`:''}><span class="dn">${i}</span>${f.map(s=>{const sh=d.shifts.find(x=>x.date===s.date&&x.name===s.name);return `<span class="who ${col(s.name)}">${esc(s.name.split(' ')[0])}<i>${sh?Math.round(pay(sh).total).toLocaleString('ru-RU'):(s.close?'':'на смене')}</i></span>`}).join('')}${p.map(s=>`<span class="who plan ${col(s.name)}">${esc(s.name.split(' ')[0])}</span>`).join('')}</div>`;}
  $('cal').innerHTML=cells;
  $('schedSum').innerHTML=names.map(n=>{const mine=list.filter(s=>s.name===n);const h=mine.reduce((a,s)=>a+(hrs(s)||0),0);
    return `<div class="person"><div class="ph"><span class="name"><span class="dot ${col(n)}"></span>${esc(n)}</span><span class="total num">${mine.length} ${mine.length%10==1&&mine.length%100!=11?'смена':(mine.length%10>=2&&mine.length%10<=4&&(mine.length%100<10||mine.length%100>=20))?'смены':'смен'}</span></div>
    <div class="lines num"><div class="ln"><span>ЗП за отработанные смены</span><span class="v"></span><b>${rub(d.shifts.filter(x=>x.name===n&&x.date.startsWith(sm)).reduce((a,x)=>a+pay(x).total,0))}</b></div><div class="ln"><span>Запланировано вперёд</span><span class="v"></span><b>${(planCache[cur]||[]).filter(s=>s.name===n&&s.date>=today&&s.date.startsWith(sm)).length} см.</b></div></div></div>`}).join('')||'<div class="empty">Смен в этом месяце нет</div>';}

function pay(s){const r=unlocked[cur].rates;const p={base:r.base,draft:s.draft*r.draft/100,bottle:s.bottle*r.bottle,liq:s.liq*r.liq,kitchen:s.kitchen*r.kitchen/100};p.total=p.base+p.draft+p.bottle+p.liq+p.kitchen;return p;}
function lastDay(m){const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate();}
function periodLabel(){const m=$('month').value;const[y,mm]=m.split('-');const L=lastDay(m);
  return half==='1'?`01–15.${mm}.${y}`:half==='2'?`16–${L}.${mm}.${y}`:`01–${L}.${mm}.${y}`;}
let who=(lsGet('zp-who')||{});
function visible(){const m=$('month').value;const w=who[cur]||'';return unlocked[cur].shifts.filter(s=>(!w||s.name===w)&&s.date.startsWith(m)&&(half==='0'||(half==='1'?+s.date.slice(8)<=15:+s.date.slice(8)>=16))).sort((a,b)=>a.date.localeCompare(b.date));}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){const list=visible();$('pLabel').textContent=periodLabel();
  document.querySelectorAll('#half button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.h===half));
  const by={};list.forEach(s=>{const p=pay(s);const o=by[s.name]=by[s.name]||{n:0,base:0,draft:0,bottle:0,liq:0,kitchen:0,total:0,v:{draft:0,bottle:0,liq:0,kitchen:0}};o.n++;for(const f in p)o[f]+=p[f];for(const f in o.v)o.v[f]+=s[f];});
  const names=Object.keys(by).sort((a,b)=>by[b].total-by[a].total);
  $('people').innerHTML=names.length?names.map(n=>{const o=by[n];return `<div class="person"><div class="ph"><span class="name">${esc(n)}</span><span class="total num">${rub(o.total)}</span></div>
    <div class="lines num">${[['Смены',o.n+' шт',o.base],['Розлив',rub(o.v.draft),o.draft],['Фасовка, вода',o.v.bottle+' шт',o.bottle],['Настойки',o.v.liq+' шт',o.liq],['Кухня, снеки',rub(o.v.kitchen),o.kitchen]].map(([l,v,z])=>`<div class="ln"><span>${l}</span><span class="v">${v}</span><b>${rub(z)}</b></div>`).join('')}</div></div>`}).join('')
    :'<div class="empty">В этом периоде закрытых смен нет</div>';
  const g=names.reduce((a,n)=>a+by[n].total,0);
  $('grand').innerHTML=names.length?`<span>Всего · ${list.length} смен</span><b class="num">${rub(g)}</b>`:'';
  $('rows').innerHTML=list.length?list.map(s=>{const p=pay(s);const c=(v,z)=>`<td class="num">${v}<span class="zp">${rub(z)}</span></td>`;return `<tr><td class="num">${s.date.slice(8)}.${s.date.slice(5,7)}</td><td>${esc(s.name)}</td>${c(rub(s.draft),p.draft)}${c(s.bottle+' шт',p.bottle)}${c(s.liq+' шт',p.liq)}${c(rub(s.kitchen),p.kitchen)}<td class="num"><b>${rub(p.total)}</b></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Нет смен</td></tr>';}
$('month').onchange=render;
$('who').onchange=()=>{who[cur]=$('who').value;lsSet('zp-who',who);render();};
document.querySelectorAll('#half button').forEach(b=>b.onclick=()=>{half=b.dataset.h;render();});
$('copy').onclick=()=>{const by={};visible().forEach(s=>{by[s.name]=by[s.name]||{n:0,t:0};by[s.name].n++;by[s.name].t+=pay(s).total;});
  const txt=`Зарплата ${BAR[cur].t}, ${periodLabel()}\n`+Object.entries(by).map(([n,o])=>`${n}: ${o.n} смен — ${rub(o.t)}`).join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать'));};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
$('updNote').textContent=VAULT?'Данные GainUp на '+VAULT.updated:'';
(async()=>{const saved=lsGet(LS);if(!saved||!VAULT)return;let first=null;
  for(const b of ['13','epo']){if(!saved[b])continue;const d=await tryUnlock(b,saved[b]);if(d){unlocked[b]=d;first=first||b;}else{delete saved[b];}}
  lsSet(LS,Object.keys(saved).length?saved:null);
  canAll=!!(unlocked['13']&&unlocked['epo']);
  const last=lsGet('zp-bar');if(last&&unlocked[last])open(last);else if(first&&!canAll)open(first);})();
</script>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
