name: probe-gainup
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Login page
        run: |
          curl -sS -L -c cj.txt -A "Mozilla/5.0" -o p.html -w "code=%{http_code} url=%{url_effective}\n" https://app.gainbp.com/13ruleskirov/retail/sales || true
          echo "--- forms/inputs"
          grep -oiE '<form[^>]*>|<input[^>]*>|<button[^>]*>' p.html | sed -E 's/value="[^"]{20,}"/value="…"/' | head -40
          echo "--- title"; grep -oiE '<title>[^<]*' p.html
          echo "--- cookies"; cut -f6 cj.txt | tail -n +5
