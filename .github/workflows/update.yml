name: Обновление зарплаты из GainUp
on:
  schedule:
    # GitHub запускает по расписанию с опозданием до часа и больше, поэтому стартуем заранее,
    # с запасными попытками; лишние запуски ничего не делают, если сегодня уже обновлено.
    - cron: '7 5 * * *'    # 08:07 по Москве
    - cron: '7 6 * * *'    # 09:07
    - cron: '7 7 * * *'    # 10:07
    - cron: '37 9 * * *'   # 12:37
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Уже обновлено сегодня?
        id: chk
        run: |
          today=$(date -u -d '+3 hours' +%Y-%m-%d)
          stamp=$(grep -o '"stamp":"[^"]*"' index.html | cut -d'"' -f4)
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$stamp" > "${today}T08:00" ]]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "сегодня уже обновлено ($stamp)"; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with: { node-version: 22 }
      - run: npm i --no-save cheerio@1.0.0
        if: steps.chk.outputs.skip != '1'
      - name: Забрать смены из GainUp
        if: steps.chk.outputs.skip != '1'
        env:
          GAINUP_LOGIN: ${{ secrets.GAINUP_LOGIN }}
          GAINUP_PASSWORD: ${{ secrets.GAINUP_PASSWORD }}
        run: node tools/fetch-node.mjs "$RUNNER_TEMP/data.json"
      - name: Собрать и опубликовать
        if: steps.chk.outputs.skip != '1'
        run: |
          node tools/build.mjs "$RUNNER_TEMP/data.json"
          git config user.name "antonsmirnovn-ux"
          git config user.email "antonsmirnovn-ux@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -m "Автообновление данных $(date -u -d '+3 hours' '+%d.%m.%Y %H:%M')"
          git push
